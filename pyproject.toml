[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incubator"
version = "0.1.0"
description = "이물 검출 모델을 실험·학습·검증해 메인 앱으로 내보내는 툴"
requires-python = ">=3.11"
# torch / torchvision 은 CUDA 빌드를 직접 설치한다 (README 참고)
dependencies = [
    "PySide6",
    "ultralytics==8.4.191",   # .pt 예측 레터박스(rect)와 ONNX 내보내기 입력이 버전마다 다를 수 있어 고정
    "opencv-python",
    "numpy",
    "scikit-learn",
    "onnx",
    "onnxruntime",
    "onnxslim",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[tool.setuptools.packages.find]
include = ["incubator*"]

[tool.pytest.ini_options]
markers = ["slow: GPU/모델 다운로드 필요"]
addopts = "-m \"not slow\""
testpaths = ["tests"]
